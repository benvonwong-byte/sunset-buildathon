<script>
// Line-drawn Outer Sunset houses, like the bottom of the flyer. Seeded so the row is the same on every load.
(function () {
  function row(svg, seed) {
    var s = seed;
    function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
    var base = 108, x = -10, d = 'M-20 ' + base + ' H1220 ';
    while (x < 1210) {
      var w = 78 + Math.round(rnd() * 52), h = 52 + Math.round(rnd() * 40), top = base - h;
      var gap = rnd() < .3 ? 6 + Math.round(rnd() * 10) : 0;
      // facade, with a stepped parapet on some
      if (rnd() < .45) {
        var step = 6 + Math.round(rnd() * 6), inset = 10 + Math.round(rnd() * 10);
        d += 'M' + x + ' ' + base + ' V' + (top + step) + ' H' + (x + inset) + ' V' + top + ' H' + (x + w - inset) + ' V' + (top + step) + ' H' + (x + w) + ' V' + base + ' ';
      } else {
        d += 'M' + x + ' ' + base + ' V' + top + ' H' + (x + w) + ' V' + base + ' ';
      }
      // garage door or front door
      var dw = rnd() < .5 ? Math.round(w * .42) : 14, dh = dw > 20 ? 26 : 22, dx = x + Math.round(w * (rnd() < .5 ? .12 : .5));
      if (dx + dw > x + w - 6) dx = x + w - 6 - dw;
      d += 'M' + dx + ' ' + base + ' V' + (base - dh) + ' H' + (dx + dw) + ' V' + base + ' ';
      // bay window or a pair of square windows
      var wy = top + 14 + Math.round(rnd() * 6);
      if (rnd() < .45 && w > 92) {
        var bx = x + Math.round(w / 2) - 22;
        d += 'M' + bx + ' ' + (wy + 18) + ' L' + (bx + 8) + ' ' + wy + ' H' + (bx + 36) + ' L' + (bx + 44) + ' ' + (wy + 18) + ' Z ';
        d += 'M' + (bx + 15) + ' ' + wy + ' V' + (wy + 18) + ' M' + (bx + 29) + ' ' + wy + ' V' + (wy + 18) + ' ';
      } else {
        var ws = 12, n = w > 100 ? 3 : 2;
        for (var i = 0; i < n; i++) {
          var wx = x + Math.round((i + 1) * w / (n + 1)) - ws / 2;
          d += 'M' + wx + ' ' + wy + ' h' + ws + ' v' + ws + ' h-' + ws + ' Z ';
        }
      }
      if (rnd() < .09) d += 'M' + (x + w - 18) + ' ' + top + ' V' + (top - 14) + ' l8 3 l-8 3 ';
      x += w + gap;
    }
    svg.innerHTML = '<path d="' + d + '"/>';
  }
  var a = document.getElementById('sky-top'), b = document.getElementById('sky-bottom');
  if (a) row(a, 1009);
  if (b) row(b, 4114);
})();

// Every photo, in the order they were taken. Click any photo to browse.
var PHOTOS = {{photos}};
(function () {
  var dlg = document.getElementById('lb'), img = document.getElementById('lbimg'), cap = document.getElementById('lbcap'), count = document.getElementById('lbcount');
  var cur = 0, opener = null;
  function show(i) {
    cur = (i + PHOTOS.length) % PHOTOS.length;
    var p = PHOTOS[cur];
    img.src = '{{assets}}photos/' + p.n + '.jpg'; img.alt = p.c;
    cap.innerHTML = '<b>' + p.t + '</b>' + p.c.replace(/</g, '&lt;');
    count.textContent = (cur + 1) + ' / ' + PHOTOS.length;
    var nx = new Image(); nx.src = '{{assets}}photos/' + PHOTOS[(cur + 1) % PHOTOS.length].n + '.jpg';
  }
  function open(i, el) {
    opener = el || null; show(i);
    if (typeof dlg.showModal === 'function') { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } } else dlg.setAttribute('open', '');
  }
  function close() { if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); } }
  dlg.addEventListener('close', function () { if (opener) opener.focus(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-i]');
    if (b && !dlg.contains(b)) { open(parseInt(b.getAttribute('data-i'), 10) - 1, b); }
  });
  document.getElementById('lbprev').addEventListener('click', function () { show(cur - 1); });
  document.getElementById('lbnext').addEventListener('click', function () { show(cur + 1); });
  document.getElementById('lbclose').addEventListener('click', close);
  dlg.addEventListener('click', function (e) { if (e.target === dlg || e.target.id === 'lbstage') close(); });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
  });
  var x0 = null;
  img.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
  img.addEventListener('pointerup', function (e) { if (x0 === null) return; var dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); });
})();

// Filter the dream cards by thread.
(function () {
  var chips = document.querySelectorAll('#filters .chip');
  var cards = document.querySelectorAll('#dreamcards .card');
  var out = document.getElementById('showing');
  var names = {{threadNames}}, total = {{dreamCount}};
  function apply(f) {
    var n = 0;
    cards.forEach(function (c) {
      var on = f === 'all' || (' ' + c.getAttribute('data-t') + ' ').indexOf(' ' + f + ' ') > -1;
      c.hidden = !on;
      if (on) n++;
    });
    chips.forEach(function (ch) { ch.setAttribute('aria-pressed', ch.getAttribute('data-f') === f ? 'true' : 'false'); });
    out.textContent = f === 'all' ? 'Showing all ' + total + ' dreams.' : 'Showing ' + n + ' of ' + total + ' dreams: ' + names[f] + '.';
  }
  chips.forEach(function (ch) { ch.addEventListener('click', function () { apply(ch.getAttribute('data-f')); }); });
})();
</script>
