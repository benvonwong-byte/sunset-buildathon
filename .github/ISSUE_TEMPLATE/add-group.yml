name: Add a group or a calendar
description: Get a Sunset group, venue or calendar onto sunset.dearcrisis.com
title: "Add: "
labels: ["add-group"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. The calendar fills itself from feeds, so the most useful thing is a link to wherever the group keeps its events: a public Google Calendar, Luma, Meetup, Eventbrite, a Squarespace or WordPress events page, or any `.ics` feed. If the group only posts on Instagram or flyers, say so; helping set up a free calendar is a buildathon task.
  - type: input
    id: name
    attributes:
      label: Group or venue name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      placeholder: https://
    validations:
      required: true
  - type: input
    id: calendar
    attributes:
      label: Where the events are posted
      description: Calendar link, events page, Luma or Meetup page, Instagram handle
  - type: input
    id: where
    attributes:
      label: Address or meeting spot in the Sunset
  - type: textarea
    id: what
    attributes:
      label: What they do, in a sentence
      description: Plain words. What a neighbor can show up to.
  - type: dropdown
    id: relation
    attributes:
      label: Your connection
      options:
        - I run or help run this group
        - I attend
        - I found it
